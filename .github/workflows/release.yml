name: 构建发行包

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: windows-2025
            label: windows-x86_64
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 读取固定 TDLib 版本
        shell: bash
        run: echo "TDLIB_COMMIT=$(tr -d '\r\n' < TDLIB_COMMIT)" >> "$GITHUB_ENV"

      - name: Linux 编译依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf libssl-dev zlib1g-dev php-cli

      - name: macOS 编译依赖
        if: runner.os == 'macOS'
        run: brew install cmake ninja gperf openssl@3

      - name: Windows 编译依赖
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows zlib:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg 安装失败" }
          choco install gperf -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "gperf 安装失败" }

      - name: 缓存 TDLib 动态库
        id: native-cache
        uses: actions/cache@v4
        with:
          path: native
          key: tdlib-${{ matrix.label }}-${{ env.TDLIB_COMMIT }}-v1

      - name: 获取官方固定源码
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git init td-source
          git -C td-source remote add origin https://github.com/tdlib/td.git
          git -C td-source fetch --depth 1 origin "$TDLIB_COMMIT"
          git -C td-source checkout --detach FETCH_HEAD
          test "$(git -C td-source rev-parse HEAD)" = "$TDLIB_COMMIT"

      - name: 编译 TDLib（Linux）
        if: runner.os == 'Linux' && steps.native-cache.outputs.cache-hit != 'true'
        run: |
          (cd td-source && php SplitSource.php)
          cmake -S td-source -B td-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_LTO=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build td-build --target tdjson --parallel 2
          mkdir -p native
          cp td-build/libtdjson.so native/
          cp td-source/LICENSE_1_0.txt native/TDLib-LICENSE.txt

      - name: 编译 TDLib（macOS）
        if: runner.os == 'macOS' && steps.native-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S td-source -B td-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTD_ENABLE_LTO=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build td-build --target tdjson --parallel 2
          mkdir -p native
          cp td-build/libtdjson.dylib native/
          cp td-source/LICENSE_1_0.txt native/TDLib-LICENSE.txt
          openssl_license=$(find "$(brew --prefix openssl@3)/" -name LICENSE.txt -type f -print -quit)
          test -n "$openssl_license"
          cp "$openssl_license" native/OpenSSL-LICENSE.txt

      - name: 编译 TDLib（Windows）
        if: runner.os == 'Windows' && steps.native-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $gperf = (Get-Command gperf.exe -ErrorAction Stop).Source
          cmake -S td-source -B td-build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows "-DGPERF_EXECUTABLE=$gperf" -DTD_ENABLE_LTO=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }
          cmake --build td-build --config Release --target tdjson --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "TDLib 编译失败" }
          New-Item -ItemType Directory -Path native -Force | Out-Null
          Copy-Item td-build/Release/tdjson.dll native/
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" native/
          Copy-Item td-source/LICENSE_1_0.txt native/TDLib-LICENSE.txt
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/openssl/copyright" native/OpenSSL-LICENSE.txt
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/zlib/copyright" native/zlib-LICENSE.txt

      - name: 构建 Rust 程序
        env:
          TG_APP_API_ID: ${{ secrets.TG_APP_API_ID }}
          TG_APP_API_HASH: ${{ secrets.TG_APP_API_HASH }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] && { [[ -z "$TG_APP_API_ID" ]] || [[ -z "$TG_APP_API_HASH" ]]; }; then
            echo "正式发行包需配置 TG_APP_API_ID / TG_APP_API_HASH；普通使用者只进行手机号登录。"
            exit 1
          fi
          cargo build --workspace --release --locked

      - name: 汇总 Rust 依赖许可证
        shell: bash
        run: |
          cargo install --locked --features cli cargo-about
          cargo about generate about.hbs > THIRD-PARTY-LICENSES.html

      - name: 组装并验证发行包
        shell: pwsh
        run: |
          $label = '${{ matrix.label }}'
          $package = Join-Path $PWD "dist/telegram-tui-$label"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          Copy-Item "target/release/tg$suffix","target/release/tgcd$suffix" $package
          Copy-Item native/* $package
          Copy-Item README.md,LICENSE,TDLIB_COMMIT,THIRD_PARTY_NOTICES.md,THIRD-PARTY-LICENSES.html $package
          Copy-Item docs -Destination $package -Recurse
          & "$package/tg$suffix" --version
          if ($LASTEXITCODE -ne 0) { throw "tg 无法启动" }
          $metadata = & "$package/tgcd$suffix" --check-library
          if ($LASTEXITCODE -ne 0) { throw "打包后的 TDLib 无法加载" }
          $metadata | Set-Content -LiteralPath "$package/TDLIB-BUILD.json" -Encoding utf8
          $library = $metadata | ConvertFrom-Json
          if ($library.commit -ne $env:TDLIB_COMMIT) { throw "TDLib 源码版本不一致" }
          & "$package/tg$suffix" tui --demo --snapshot "$package/preview.svg"
          if ($LASTEXITCODE -ne 0) { throw "TUI 渲染失败" }
          if ($IsWindows) {
            Compress-Archive -Path "$package/*" -DestinationPath "dist/telegram-tui-$label.zip"
          } else {
            tar -czf "dist/telegram-tui-$label.tar.gz" -C $package .
            if ($LASTEXITCODE -ne 0) { throw "压缩失败" }
          }

      - name: 构建 Debian 包
        if: runner.os == 'Linux'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          root=dist/debian-root
          mkdir -p "$root/DEBIAN" "$root/usr/lib/telegram-tui" "$root/usr/bin" "$root/usr/share/doc/telegram-cli"
          cp dist/telegram-tui-linux-x86_64/tg dist/telegram-tui-linux-x86_64/tgcd dist/telegram-tui-linux-x86_64/libtdjson.so "$root/usr/lib/telegram-tui/"
          ln -s ../lib/telegram-tui/tg "$root/usr/bin/tg"
          ln -s ../lib/telegram-tui/tgcd "$root/usr/bin/tgcd"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md THIRD-PARTY-LICENSES.html native/TDLib-LICENSE.txt "$root/usr/share/doc/telegram-cli/"
          printf 'Package: telegram-cli\nVersion: %s\nArchitecture: amd64\nMaintainer: ZONGRUICHD\nDepends: libc6, libstdc++6, libssl3, zlib1g\nDescription: Telegram-TUI terminal client and AI CLI\n' "$version" > "$root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$root" "dist/telegram-tui-linux-x86_64.deb"

      - name: 上传经过验证的构建产物
        uses: actions/upload-artifact@v4
        with:
          name: telegram-tui-${{ matrix.label }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 'Telegram-TUI ${{ github.ref_name }}'
          body: '终端聊天与 AI CLI。请完成真实账号验收后发布；构建说明见 docs/BUILD.md。'
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
